<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>一步 · 目标太远，先做一步</title>
  <meta name="theme-color" content="#FBFAF8">
  <meta name="description" content="把今年想做成的一件事，拆成今天能做完的两三个动作。做完存下快乐积分，攒够了换一个你真正想要的礼物。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E9793F'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="一步">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app" id="app">
    <section class="page" data-page="today"></section>
    <section class="page" data-page="goals" hidden></section>
    <section class="page" data-page="calendar" hidden></section>
    <section class="page" data-page="bank" hidden></section>

    <nav class="tabbar" id="tabbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"><path d="M9 16.5l4.5 4.5L23 11.5"/></svg>
        </span>
        <span class="brand-text">
          <strong>一步</strong>
          <em>目标太远，先做一步</em>
        </span>
      </div>

      <button data-tab="today" class="is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
        </svg>
        <span>今天</span>
      </button>
      <button data-tab="goals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="4.6"/>
          <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span>目标</span>
      </button>
      <button data-tab="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.2" y="5" width="17.6" height="16" rx="3"/>
          <path d="M8 3v4M16 3v4M3.2 10.2h17.6"/>
        </svg>
        <span>日历</span>
      </button>
      <button data-tab="bank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8.5h16V18a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18V8.5z"/>
          <path d="M4 8.5 6.6 4h10.8L20 8.5"/>
          <circle cx="16" cy="14" r="1.3"/>
        </svg>
        <span>银行</span>
      </button>

      <button class="side-foot" data-data="1">数据只存在这台设备上<br>点这里导出备份</button>
    </nav>
  </div>

  <div id="layer"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
